name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install owner acceptance tools
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.16.0
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run owner acceptance
        run: sh scripts/test.sh

      - name: Resolve and verify the immutable coordinate
        id: coordinate
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: "\([0-9][0-9.]*\)"$/\1/p' pack.yml)
          test -n "$version"
          tag="v$version"
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            existing=$(git rev-list -n 1 "$tag")
            test "$existing" = "$GITHUB_SHA" || {
              echo "::error::immutable tag $tag already points to $existing, not $GITHUB_SHA"
              exit 1
            }
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the release record
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.coordinate.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
